<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f2efe8;font-family:"Bricolage Grotesque",system-ui;color:#141414}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:28px}
.opt{background:#fff;border-radius:26px;padding:26px 24px 20px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.k{font:700 11px "JetBrains Mono";letter-spacing:1.2px;text-transform:uppercase;color:#8d8a82}
.lock{display:flex;align-items:center;gap:10px;font-weight:800;font-size:40px;letter-spacing:-1.8px}
.lock svg{width:64px;height:64px}
.big{width:220px;height:220px;align-self:center}
.dark{background:#141414;border-radius:18px;padding:12px 18px;color:#fff;align-self:stretch;display:flex;gap:10px;align-items:center}
.dark svg{width:46px;height:46px}
.row{display:flex;gap:16px;align-items:end;align-self:stretch}
.fav svg{width:16px;height:16px}.fav32 svg{width:32px;height:32px}
.app{width:76px;height:76px;border-radius:20px;background:#c6f432;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #141414}
.app svg{width:62px;height:62px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- D1: eyes in the rear-view mirror, glancing back -->
  <symbol id="D1" viewBox="0 0 64 64">
    <path d="M33 6 L35 18" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
    <g transform="rotate(-7 32 36)">
      <rect x="3" y="21" width="58" height="31" rx="15.5" fill="#141414"/>
      <rect x="3" y="17" width="58" height="31" rx="15.5" fill="#141414"/>
      <rect x="7.5" y="21.5" width="49" height="22" rx="11" fill="#c6f432"/>
      <ellipse cx="23" cy="32.5" rx="7.2" ry="7.6" fill="#fff" stroke="#141414" stroke-width="2.6"/>
      <ellipse cx="41" cy="32.5" rx="7.2" ry="7.6" fill="#fff" stroke="#141414" stroke-width="2.6"/>
      <circle cx="19.6" cy="33.6" r="3.4" fill="#141414"/>
      <circle cx="37.6" cy="33.6" r="3.4" fill="#141414"/>
      <circle cx="18.5" cy="32.4" r="1.1" fill="#fff"/>
      <circle cx="36.5" cy="32.4" r="1.1" fill="#fff"/>
      <path d="M15.5 28 Q23 24.5 30.5 27.5" fill="#141414"/>
      <path d="M15.6 27.6 Q23 23.6 30.4 27.2 L30.4 28.6 Q23 26.2 15.6 29.2 Z" fill="#141414"/>
      <path d="M33.6 27.2 Q41 23.6 48.4 27.6 L48.4 29.2 Q41 26.2 33.6 28.6 Z" fill="#141414"/>
    </g>
  </symbol>
  <!-- D2: same mirror, eyes plus a small check in the corner (the call you made) -->
  <symbol id="D2" viewBox="0 0 64 64">
    <path d="M33 6 L35 18" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
    <g transform="rotate(-7 32 36)">
      <rect x="3" y="21" width="58" height="31" rx="15.5" fill="#141414"/>
      <rect x="3" y="17" width="58" height="31" rx="15.5" fill="#141414"/>
      <rect x="7.5" y="21.5" width="49" height="22" rx="11" fill="#c6f432"/>
      <ellipse cx="22" cy="32.5" rx="7" ry="7.4" fill="#fff" stroke="#141414" stroke-width="2.6"/>
      <ellipse cx="38" cy="32.5" rx="7" ry="7.4" fill="#fff" stroke="#141414" stroke-width="2.6"/>
      <circle cx="18.8" cy="33.4" r="3.3" fill="#141414"/>
      <circle cx="34.8" cy="33.4" r="3.3" fill="#141414"/>
      <path d="M47 33 L50 36 L54.5 29.5" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </symbol>
</defs></svg>
<div class="sheet">
  <div class="opt"><span class="k">D1 · Eyes in the mirror, glancing back</span>
    <svg class="big"><use href="#D1"/></svg>
    <div class="lock"><svg><use href="#D1"/></svg>hindsight</div>
    <div class="dark"><svg><use href="#D1"/></svg><b style="font-size:26px">hindsight</b></div>
    <div class="row"><div class="app"><svg><use href="#D1"/></svg></div><span class="fav"><svg><use href="#D1"/></svg></span><span class="fav32"><svg><use href="#D1"/></svg></span><span class="k">app icon · 16 · 32</span></div>
  </div>
  <div class="opt"><span class="k">D2 · Eyes + the call you made</span>
    <svg class="big"><use href="#D2"/></svg>
    <div class="lock"><svg><use href="#D2"/></svg>hindsight</div>
    <div class="dark"><svg><use href="#D2"/></svg><b style="font-size:26px">hindsight</b></div>
    <div class="row"><div class="app"><svg><use href="#D2"/></svg></div><span class="fav"><svg><use href="#D2"/></svg></span><span class="fav32"><svg><use href="#D2"/></svg></span><span class="k">app icon · 16 · 32</span></div>
  </div>
</div>
</body></html>
