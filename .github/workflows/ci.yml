name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  move:
    name: Move tests
    runs-on: ubuntu-latest
    env:
      SUI_VERSION: mainnet-v1.82.3
    steps:
      - uses: actions/checkout@v4
      - name: Install the Sui CLI
        run: |
          curl -sSfL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" -o sui.tgz
          mkdir -p sui-bin && tar -xzf sui.tgz -C sui-bin
          echo "$(dirname "$(find "$PWD/sui-bin" -type f -name sui | head -1)")" >> "$GITHUB_PATH"
      - run: sui --version
      - run: sui move test --path move
